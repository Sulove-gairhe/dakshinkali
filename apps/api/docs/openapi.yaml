openapi: 3.0.3
info:
  title: Product Module API
  description: |
    REST API for managing product inventory in the Dakshinkali Electronics Center e-commerce platform.
    
    The API follows a layered architecture with strict separation of concerns and uses DTOs (Data Transfer Objects) 
    to decouple clients from database schema changes.
    
    **Key Features:**
    - Admin API for full CRUD operations (requires authentication)
    - Public API for product browsing (no authentication required)
    - Cart API for authenticated and guest shopping carts
    - Soft delete for data preservation
    - Image storage integration with Supabase
    - Pagination, filtering, search, and sorting
    - Consistent error response format
    
    **Authentication:**
    - Tokens are issued by Supabase Auth, not this Express API
    - Sign in with `supabase.auth.signInWithPassword({ email, password })`
    - Use `session.access_token` as `Authorization: Bearer <supabase_access_token>`
    - Admin endpoints require `app_metadata.role = "admin"` on the Supabase Auth user
    - Cart endpoints accept a JWT Bearer token for authenticated users or `X-Session-ID` for guest carts
    
    **Rate Limiting:**
    - Admin endpoints: 100 requests per minute per user
  version: 1.0.0
  contact:
    name: API Support
    email: support@dakshinkali-electronics.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3002/api/v1
    description: Local development server (default)
  - url: https://staging-api.dakshinkali-electronics.com/api/v1
    description: Staging server
  - url: https://api.dakshinkali-electronics.com/api/v1
    description: Production 

tags:
  - name: Admin Products
    description: Admin product management endpoints (requires authentication)
  - name: Public Products
    description: Public product browsing endpoints (no authentication required)
  - name: Cart
    description: Shopping cart endpoints for authenticated users and guests
  - name: Orders
    description: Customer order endpoints
  - name: Admin Orders
    description: Admin order management endpoints
  - name: Profile
    description: Current user profile endpoints
  - name: Admin
    description: Admin dashboard and user-management endpoints

paths:
  /admin/products:
    post:
      tags:
        - Admin Products
      summary: Create a new product
      description: |
        Create a new product with optional images.
        
        **Business Rules:**
        - Product name must be unique within the same category
        - Price must be greater than 0
        - Maximum 5 images allowed
        - Each image must be max 5MB
        - Supported image formats: JPEG, PNG, WebP
        - Status defaults to "active" if not provided
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - category
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Product name (unique within category)
                  example: iPhone 15 Pro
                description:
                  type: string
                  maxLength: 2000
                  description: Product description
                  example: Latest iPhone with A17 Pro chip
                price:
                  type: number
                  format: double
                  minimum: 0.01
                  description: Product price (must be > 0)
                  example: 999.99
                category:
                  type: string
                  minLength: 1
                  description: Product category
                  example: electronics
                status:
                  $ref: '#/components/schemas/ProductStatus'
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: Product images (max 5 files, 5MB each, JPEG/PNG/WebP)
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Admin Products
      summary: List all products (admin)
      description: |
        List all products with filtering and pagination.
        
        **Features:**
        - Pagination with configurable page size (default: 20, max: 100)
        - Filter by category, status, price range
        - Search in product name and description (case-insensitive)
        - Option to include soft-deleted products
      operationId: listProductsAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/MinPriceParam'
        - $ref: '#/components/parameters/MaxPriceParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: includeDeleted
          in: query
          description: Include soft-deleted products
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/products/{id}:
    get:
      tags:
        - Admin Products
      summary: Get product by ID (admin)
      description: |
        Get a single product by ID.
        
        **Features:**
        - Option to include soft-deleted products
        - Returns complete product details including all images
      operationId: getProductByIdAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
        - name: includeDeleted
          in: query
          description: Include soft-deleted product
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Admin Products
      summary: Update a product
      description: |
        Update an existing product. All fields are optional (partial update).
        
        **Features:**
        - Partial updates supported (only provided fields are updated)
        - Add new images via images array
        - Remove existing images via removeImages array
        - Name uniqueness is checked within category if name is being changed
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Admin Products
      summary: Delete a product (soft delete)
      description: |
        Soft delete a product. The product is marked as deleted but data is preserved.
        
        **Behavior:**
        - Sets deleted_at timestamp
        - Preserves all product data
        - Product is excluded from public API responses
        - Admin can still view with includeDeleted=true parameter
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      responses:
        '204':
          description: Product deleted successfully (no content)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products:
    get:
      tags:
        - Public Products
      summary: List active products (public)
      description: |
        List active products with filtering, search, sorting, and pagination.
        
        **Features:**
        - No authentication required
        - Returns only active, non-deleted products
        - Pagination with configurable page size (default: 20, max: 100)
        - Filter by category, price range
        - Search in product name and description (case-insensitive)
        - Sort by price, name, or creation date
        - Default sorting: newest first (createdAt desc)
      operationId: listProductsPublic
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/MinPriceParam'
        - $ref: '#/components/parameters/MaxPriceParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: sortBy
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: [price, name, createdAt]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort direction
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products/{id}:
    get:
      tags:
        - Public Products
      summary: Get product by ID (public)
      description: |
        Get a single active product by ID.
        
        **Behavior:**
        - No authentication required
        - Returns only active, non-deleted products
        - Returns 404 for deleted products
        - Returns 404 for inactive products
        - Returns 404 for non-existent products
      operationId: getProductByIdPublic
      parameters:
        - $ref: '#/components/parameters/ProductIdParam'
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart:
    get:
      tags:
        - Cart
      summary: Get current cart
      description: |
        Get the cart for the authenticated user or guest session.

        Provide either:
        - `Authorization: Bearer <token>` for authenticated users
        - `X-Session-ID: <session-id>` for guest carts
      operationId: getCart
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
      responses:
        '200':
          description: Cart retrieved successfully. Returns an empty cart shape when no cart exists.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CartDTO'
                  - $ref: '#/components/schemas/EmptyCartDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Cart
      summary: Clear current cart
      description: Clear all items from the authenticated user's or guest session's cart.
      operationId: clearCart
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
      responses:
        '204':
          description: Cart cleared successfully or no cart existed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart/items:
    post:
      tags:
        - Cart
      summary: Add item to cart
      description: Add a product to the current cart. If the product already exists in the cart, quantities are added together.
      operationId: addCartItem
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '201':
          description: Item added and updated cart returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart/items/{id}:
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      description: Update a cart item's quantity. Quantity `0` removes the item.
      operationId: updateCartItem
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CartItemIdParam'
        - $ref: '#/components/parameters/SessionIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Item updated and updated cart returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Cart
      summary: Remove cart item
      description: Remove a single cart item and return the updated cart.
      operationId: removeCartItem
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CartItemIdParam'
        - $ref: '#/components/parameters/SessionIdHeader'
      responses:
        '200':
          description: Item removed and updated cart returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart/merge:
    post:
      tags:
        - Cart
      summary: Merge guest cart into authenticated cart
      description: Merge a guest cart identified by `sessionId` into the authenticated user's cart. Requires a bearer token.
      operationId: mergeCart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeCartRequest'
      responses:
        '200':
          description: Carts merged and updated authenticated cart returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    post:
      tags:
        - Orders
      summary: Create order from cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Orders
      summary: List current user's orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/OrderStatusParam'
      responses:
        '200':
          description: Orders retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get current user's order detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{id}/cancel:
    put:
      tags:
        - Orders
      summary: Cancel current user's order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/orders:
    get:
      tags:
        - Admin Orders
      summary: List all orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/OrderStatusParam'
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Orders retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/orders/stats:
    get:
      tags:
        - Admin Orders
      summary: Get order statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStats'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/orders/{id}:
    get:
      tags:
        - Admin Orders
      summary: Get any order detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/orders/{id}/status:
    put:
      tags:
        - Admin Orders
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /profile:
    get:
      tags:
        - Profile
      summary: Get current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Profile
      summary: Update current profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /admin/dashboard/stats:
    get:
      tags:
        - Admin
      summary: Get admin dashboard stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardStats'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/users:
    get:
      tags:
        - Admin
      summary: List user profiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [customer, admin]
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/users/{userId}/role:
    put:
      tags:
        - Admin
      summary: Update profile role
      description: Updates the role stored in the local `profiles` table. Prefer `PATCH /admin/users/{userId}/role` for admin authorization because it updates Supabase Auth `app_metadata.role`.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: User role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      tags:
        - Admin
      summary: Update Supabase Auth user role
      description: |
        Updates the target user's Supabase Auth `app_metadata.role` using the Supabase Admin API.
        This endpoint is protected by bearer authentication and requires the caller to already be an admin.

        The backend fetches the existing Supabase Auth user first, preserves existing `app_metadata`
        such as `provider` and `providers`, then writes the new `role`.
        The `SUPABASE_SERVICE_ROLE_KEY` is used only server-side and is never exposed to clients.

        After changing a role, the target user must sign in again or refresh their Supabase session
        to receive a fresh access token containing the updated `app_metadata.role`.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Supabase Auth user ID to update
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
            examples:
              promoteToAdmin:
                summary: Promote user to admin
                value:
                  role: admin
              demoteToCustomer:
                summary: Demote user to customer
                value:
                  role: customer
      responses:
        '200':
          description: Supabase Auth app metadata role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserRoleUpdateResponse'
              examples:
                adminRoleUpdated:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    email: admin@example.com
                    role: admin
                    appMetadata:
                      provider: email
                      providers:
                        - email
                      role: admin
                    profileUpdated: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token. Obtain it with `supabase.auth.signInWithPassword({ email, password })` and pass `session.access_token` as `Authorization: Bearer <token>`.

  parameters:
    ProductIdParam:
      name: id
      in: path
      description: Product UUID
      required: true
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000

    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PageSizeParam:
      name: pageSize
      in: query
      description: Number of items per page (max 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    CategoryParam:
      name: category
      in: query
      description: Filter by category (exact match)
      required: false
      schema:
        type: string
        example: Electronics

    StatusParam:
      name: status
      in: query
      description: Filter by product status
      required: false
      schema:
        $ref: '#/components/schemas/ProductStatus'

    MinPriceParam:
      name: minPrice
      in: query
      description: Filter products with price >= minPrice
      required: false
      schema:
        type: number
        format: double
        minimum: 0
        example: 100.00

    MaxPriceParam:
      name: maxPrice
      in: query
      description: Filter products with price <= maxPrice
      required: false
      schema:
        type: number
        format: double
        minimum: 0
        example: 1000.00

    SearchParam:
      name: search
      in: query
      description: Search in product name and description (case-insensitive)
      required: false
      schema:
        type: string
        example: iphone

    CartItemIdParam:
      name: id
      in: path
      description: Cart item UUID
      required: true
      schema:
        type: string
        format: uuid
        example: 223e4567-e89b-12d3-a456-426614174000

    SessionIdHeader:
      name: X-Session-ID
      in: header
      description: Guest cart session identifier. Required when no bearer token is provided.
      required: false
      schema:
        type: string
        example: guest-session-123

    OrderIdParam:
      name: id
      in: path
      description: Order UUID
      required: true
      schema:
        type: string
        format: uuid

    OrderStatusParam:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrderStatus'

  schemas:
    ProductStatus:
      type: string
      enum:
        - active
        - inactive
        - out_of_stock
      description: Product availability status
      example: active

    ProductImageDTO:
      type: object
      required:
        - id
        - url
        - order
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the image
          example: img-uuid-1
        url:
          type: string
          format: uri
          description: Full public URL from Supabase Storage
          example: https://storage.supabase.co/products/img1.jpg
        order:
          type: integer
          minimum: 0
          description: Display order for image gallery (0-indexed)
          example: 0

    ProductDTO:
      type: object
      required:
        - id
        - name
        - price
        - category
        - status
        - images
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique product identifier (UUID v4)
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Product name
          example: iPhone 15 Pro
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Product description (null if not provided)
          example: Latest iPhone with A17 Pro chip
        price:
          type: number
          format: double
          minimum: 0.01
          description: Product price (numeric value)
          example: 999.99
        category:
          type: string
          description: Product category
          example: Electronics
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImageDTO'
          description: Array of product images with public URLs
          maxItems: 5
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when product was created
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when product was last updated
          example: '2024-01-15T10:30:00.000Z'

    CreateProductRequest:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Product name (unique within category)
          example: iPhone 15 Pro
        description:
          type: string
          maxLength: 2000
          description: Product description
          example: Latest iPhone with A17 Pro chip
        price:
          type: number
          format: double
          minimum: 0.01
          description: Product price (must be > 0)
          example: 999.99
        category:
          type: string
          minLength: 1
          description: Product category
          example: Electronics
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          items:
            type: string
            format: binary
          maxItems: 5
          description: Product images (max 5 files, 5MB each, JPEG/PNG/WebP)

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Product name (unique within category)
          example: iPhone 15 Pro Max
        description:
          type: string
          maxLength: 2000
          description: Product description
          example: Updated description
        price:
          type: number
          format: double
          minimum: 0.01
          description: Product price (must be > 0)
          example: 1099.99
        category:
          type: string
          minLength: 1
          description: Product category
          example: Electronics
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          items:
            type: string
            format: binary
          maxItems: 5
          description: New images to add (5MB each, JPEG/PNG/WebP)
        removeImages:
          type: array
          items:
            type: string
            format: uuid
          description: Image IDs to remove
          example: [img-uuid-1, img-uuid-2]

    PaginatedProductResponse:
      type: object
      required:
        - data
        - total
        - page
        - pageSize
        - totalPages
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductDTO'
          description: Array of products
        total:
          type: integer
          minimum: 0
          description: Total number of products matching filters
          example: 150
        page:
          type: integer
          minimum: 1
          description: Current page number
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of items per page
          example: 20
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages
          example: 8

    AddToCartRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
          description: Product UUID to add
          example: 123e4567-e89b-12d3-a456-426614174000
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Quantity to add
          example: 2

    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 99
          description: New quantity. Use 0 to remove the item.
          example: 3

    MergeCartRequest:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          description: Guest session ID to merge into the authenticated user's cart
          example: guest-session-123

    CartItemDTO:
      type: object
      required:
        - id
        - productId
        - productName
        - productStatus
        - quantity
        - priceAtAddition
        - currentPrice
        - subtotal
        - isAvailable
        - priceChanged
      properties:
        id:
          type: string
          format: uuid
          example: 223e4567-e89b-12d3-a456-426614174000
        productId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        productName:
          type: string
          example: iPhone 15 Pro
        productImage:
          type: string
          nullable: true
          format: uri
          example: https://storage.supabase.co/products/img1.jpg
        productStatus:
          $ref: '#/components/schemas/ProductStatus'
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 2
        priceAtAddition:
          type: number
          format: double
          example: 999.99
        currentPrice:
          type: number
          format: double
          example: 1099.99
        subtotal:
          type: number
          format: double
          example: 1999.98
        isAvailable:
          type: boolean
          example: true
        priceChanged:
          type: boolean
          example: false

    CartDTO:
      type: object
      required:
        - id
        - userId
        - items
        - subtotal
        - total
        - itemCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 423e4567-e89b-12d3-a456-426614174000
        userId:
          type: string
          format: uuid
          nullable: true
          example: 323e4567-e89b-12d3-a456-426614174000
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemDTO'
        subtotal:
          type: number
          format: double
          example: 1999.98
        total:
          type: number
          format: double
          example: 1999.98
        itemCount:
          type: integer
          minimum: 0
          example: 2
        createdAt:
          type: string
          format: date-time
          example: '2026-05-03T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-03T10:35:00.000Z'

    EmptyCartDTO:
      type: object
      required:
        - id
        - userId
        - items
        - subtotal
        - total
        - itemCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          nullable: true
          example: null
        userId:
          type: string
          format: uuid
          nullable: true
          example: null
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemDTO'
          example: []
        subtotal:
          type: number
          enum: [0]
          example: 0
        total:
          type: number
          enum: [0]
          example: 0
        itemCount:
          type: integer
          enum: [0]
          example: 0
        createdAt:
          type: string
          nullable: true
          example: null
        updatedAt:
          type: string
          nullable: true
          example: null

    OrderStatus:
      type: string
      enum: [pending, confirmed, processing, shipped, delivered, cancelled]

    PaymentMethod:
      type: string
      enum: [cash_on_delivery, esewa, khalti, bank_transfer]

    ShippingAddress:
      type: object
      required: [line1, city, state, postalCode]
      properties:
        line1:
          type: string
        line2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          default: Nepal

    CreateOrderRequest:
      type: object
      required: [customerEmail, customerName, shippingAddress]
      properties:
        customerEmail:
          type: string
          format: email
        customerName:
          type: string
        customerPhone:
          type: string
          nullable: true
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        notes:
          type: string
          nullable: true

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        notes:
          type: string
          nullable: true

    OrderDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerEmail:
          type: string
        customerName:
          type: string
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        subtotal:
          type: number
        total:
          type: number
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        items:
          type: array
          items:
            type: object
        statusHistory:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedOrderResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderDTO'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    OrderStats:
      type: object
      properties:
        totalOrders:
          type: integer
        revenue:
          type: number
        pendingOrders:
          type: integer
        recentOrders:
          type: array
          items:
            $ref: '#/components/schemas/OrderDTO'

    ProfileDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
          nullable: true
        role:
          type: string
          enum: [customer, admin]
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [customer, admin]
      example:
        role: admin

    AuthUserRoleUpdateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
          format: email
        role:
          type: string
          enum: [customer, admin]
        appMetadata:
          type: object
          additionalProperties: true
          description: Supabase Auth app_metadata after preserving existing keys and writing role
          example:
            provider: email
            providers:
              - email
            role: admin
        profileUpdated:
          type: boolean
          description: Whether the local profiles table role was also updated

    PaginatedProfileResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDTO'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    AdminDashboardStats:
      type: object
      properties:
        products:
          type: object
        orders:
          type: object
        users:
          type: object

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error message
              example: Invalid product data
            fields:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    description: Field name with error
                    example: price
                  message:
                    type: string
                    description: Field-specific error message
                    example: Product price must be greater than 0
              description: Field-specific validation errors (optional)

  responses:
    ValidationError:
      description: Invalid request data (validation errors)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid product data
              fields:
                - field: price
                  message: Product price must be greater than 0
                - field: name
                  message: Product name is required

    UnauthorizedError:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required. Please provide a valid access token.

    ForbiddenError:
      description: Valid token but insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Admin access required for this operation.

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PRODUCT_NOT_FOUND
              message: Product with ID '123e4567-e89b-12d3-a456-426614174000' not found.

    ConflictError:
      description: Business rule violation (e.g., duplicate name)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DUPLICATE_PRODUCT
              message: A product with name 'iPhone 15' already exists in category 'Electronics'.

    RateLimitError:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          description: Request limit per time window
          schema:
            type: integer
            example: 100
        X-RateLimit-Remaining:
          description: Remaining requests in current window
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          description: Unix timestamp when rate limit resets
          schema:
            type: integer
            example: 1705320000
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests. Please try again later.
              retryAfter: 60

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred. Please try again later.
